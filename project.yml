name: OpenrouterMeta
options:
  bundleIdPrefix: com.openrouter
  deploymentTarget:
    macOS: "14.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  OpenrouterMeta:
    type: application
    platform: macOS
    sources:
      - path: Sources/OpenrouterMeta
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openrouter.OpenrouterMeta
        PRODUCT_NAME: OpenrouterMeta
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSUIElement: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: OpenrouterMeta
        INFOPLIST_KEY_NSHumanReadableCopyright: "Christmas mode for macOS"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        ENABLE_HARDENED_RUNTIME: "YES"

  OpenrouterMetaWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/OpenrouterMetaWidget
      - path: Sources/Shared
    dependencies:
      - target: OpenrouterMeta
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openrouter.OpenrouterMeta.OpenrouterMetaWidget
        PRODUCT_NAME: OpenrouterMetaWidget
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        INFOPLIST_KEY_NSExtension_NSExtensionPrincipalClass: OpenrouterMetaWidget.OpenrouterMetaWidget
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        ENABLE_HARDENED_RUNTIME: "YES"
